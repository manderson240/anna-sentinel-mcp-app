[project]
name = "anna-sentinel-mcp-app"
version = "1.1.2"
description = "Static AST Python Verifier, Claim Checker & Anna Executa Plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
anna-sentinel-mcp = "anna_sentinel.sentinel_server:main"
anna-sentinel-executa = "anna_sentinel.executa_plugin:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anna_sentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
