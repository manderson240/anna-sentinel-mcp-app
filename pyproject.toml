[project]
name = "anna-sentinel-mcp-app"
version = "0.1.0"
description = "Deterministic AST Security & QAG Claim Verification MCP App for Anna AI OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anna_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
